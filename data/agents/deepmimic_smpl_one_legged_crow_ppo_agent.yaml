# PURE DeepMimic (PPO, no AMP discriminator) agent for the one-legged crow.
#
# Same actor/critic architecture as the crow AMP policy (fc_2layers_1024units,
# FIXED std 0.05) so the warm-start checkpoint output/model_crow_ft4_ppo_init.pt
# (the crow AMP model with the discriminator stripped) loads cleanly under the
# default strict state-dict load.
#
# LR is the HALVED 1.5e-5 (not the PPO default 3e-5): the crow ft4 run showed that
# adding the sharper, event-based toe_force penalty drove a critic VALUE-runaway at
# 3e-5 that 1.5e-5 cured (grad_clip backfired). This run carries the same
# toe_force_pen AND warm-starts a critic that was trained on a different (AMP) return
# scale, so the critic has to re-calibrate -- the gentler LR keeps that bounded.
# NaN-guard still aborts cleanly if it diverges -> drop to 1e-5 next.
agent_name: "PPO"

model:
  actor_net: "fc_2layers_1024units"
  actor_init_output_scale: 0.01
  actor_std_type: "FIXED"
  action_std: 0.05

  critic_net: "fc_2layers_1024units"

optimizer:
    type: "SGD"
    learning_rate: 1.5e-5
    grad_clip: 0.0

discount: 0.99
steps_per_iter: 32
iters_per_output: 100
test_episodes: 32
normalizer_samples: 100000000

update_epochs: 5
batch_size: 4
td_lambda: 0.95
ppo_clip_ratio: 0.2
norm_adv_clip: 4.0
action_bound_weight: 10.0
action_entropy_weight: 0.0
action_reg_weight: 0.0
critic_loss_weight: 1.0
