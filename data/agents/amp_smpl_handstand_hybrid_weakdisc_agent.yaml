# Hybrid DeepMimic+AMP agent, WEAKENED discriminator. Follow-up after the
# disc-weight lever failed: at equal weight (1.0) AND at 3x weight the
# discriminator stayed PINNED at ~0.97-0.98 accuracy - the policy could never
# fool it, so the disc reward was a low, non-climbable floor (no usable style
# gradient), and 3x weight just inflated the reward scale until the critic
# diverged (NaN). Diagnosis: the disc is too STRONG as a classifier for the
# broad full-clip demo distribution (the disc-only run was contested only
# because its demos were narrow hold-window frames).
#
# Lever here: make the disc FOOLABLE so DiscAcc can drop and a real style
# gradient flows -> lower disc_loss_weight 5 -> 1.5 (train the classifier
# ~3x less aggressively). disc_reward_weight stays 1.0 (equal-mix was stable;
# raising it caused the value-scale blowup). Watch DiscAcc: target a CONTESTED
# range ~0.6-0.9 (pinned ~0.98 = still too strong; ~0.5 = collapsed/too weak).
# Other disc knobs (grad_penalty 5, logit_reg, net size) unchanged for now.
agent_name: "AMP"

model:
  actor_net: "fc_2layers_1024units"
  actor_init_output_scale: 0.01
  actor_std_type: "FIXED"
  action_std: 0.05

  critic_net: "fc_2layers_1024units"

  disc_net: "fc_2layers_1024units"

optimizer:
    type: "SGD"
    learning_rate: 3e-5

discount: 0.99
steps_per_iter: 32
iters_per_output: 100
test_episodes: 32
normalizer_samples: 100000000

update_epochs: 5
batch_size: 4
td_lambda: 0.95
ppo_clip_ratio: 0.2
norm_adv_clip: 4.0
action_bound_weight: 10.0
action_entropy_weight: 0.0
action_reg_weight: 0.0
critic_loss_weight: 1.0

disc_buffer_size: 200000
disc_replay_samples: 1000
disc_batch_size: 2048
disc_loss_weight: 1.5
disc_logit_reg: 0.01
disc_grad_penalty: 5
disc_weight_decay: 0.0001
disc_reward_scale: 2

task_reward_weight: 1.0
disc_reward_weight: 1.0
