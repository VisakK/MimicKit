# Hybrid DeepMimic + AMP agent for TRANSITION policies (spec C.4 / G). Pairs with
# the transition env (env_name: transition -> TransitionEnv subclasses AMPEnv,
# enable_task_tracking: True). Final reward =
#   task_reward_weight * (DeepMimic tracking of the MOVING A->B reference
#                         + aux + goal bonus)
#   + disc_reward_weight * disc_style(on target B's hold clip).
#
# The discriminator is the non-farmable realism gate: a collapse-to-upright pose
# is off-distribution to B's hold discriminator regardless of what the initiation
# classifier says, so it directly penalizes the v1 reward-hack. disc_reward_weight
# is THE knob: too low and the policy can still drift toward an off-pose the
# tracking tolerates; too high risks AMP's adversarial pathologies. Watch
# Disc_Demo_Acc / Disc_Agent_Acc (must contest, not pin ~0.98), Goal_Frac
# (the live pose-reach scoreboard), and Test_Return together. Cloned verbatim
# from amp_smpl_handstand_hybrid_agent.yaml (validated on the standalone hybrid
# handstand) so PPO hyperparameters are unchanged for reproducibility.
agent_name: "AMP"

model:
  actor_net: "fc_2layers_1024units"
  actor_init_output_scale: 0.01
  actor_std_type: "FIXED"
  action_std: 0.05

  critic_net: "fc_2layers_1024units"

  disc_net: "fc_2layers_1024units"

optimizer:
    type: "SGD"
    learning_rate: 3e-5
    # grad_clip: 1.0 BACKFIRED on crow->handstand (diverged EARLIER, iter 400 vs
    # 131M, and produced a fall-1.0 model) -- the instability is a critic
    # VALUE-runaway from high-variance kick-up returns, not gradient spikes, so
    # over-clipping the norm made the critic lag and destabilize faster. Reverted
    # to the validated no-clip config (scorpion->handstand = 0.808). For the hard
    # high-variance edges the right lever is a lower LR / reward scale (revisit
    # crow->handstand with a lower-LR variant). NaN-guard still aborts cleanly.
    grad_clip: 0.0

discount: 0.99
steps_per_iter: 32
iters_per_output: 100
test_episodes: 32
normalizer_samples: 100000000

update_epochs: 5
batch_size: 4
td_lambda: 0.95
ppo_clip_ratio: 0.2
norm_adv_clip: 4.0
action_bound_weight: 10.0
action_entropy_weight: 0.0
action_reg_weight: 0.0
critic_loss_weight: 1.0

disc_buffer_size: 200000
disc_replay_samples: 1000
disc_batch_size: 2048
disc_loss_weight: 5
disc_logit_reg: 0.01
disc_grad_penalty: 5
disc_weight_decay: 0.0001
disc_reward_scale: 2

task_reward_weight: 1.0
disc_reward_weight: 1.0
