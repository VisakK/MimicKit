# Hybrid DeepMimic+AMP agent, HIGHER discriminator weight. Follow-up to the
# equal-mix hybrid (task 1.0 / disc 1.0), where DiscAcc stayed pinned ~0.97
# and the shoulder only improved to ~27-29 deg (target: AMP-disc-only ~8-10):
# the discriminator was out-powered by the strong tracking reward. Here disc
# is raised to 3x the task channel to make the style signal bite, while
# task_reward_weight stays 1.0 to keep DeepMimic's stability + kick-up anchor
# (disc-only with no task reward was style-perfect but unstable, EpLen ~111).
# Watch: DiscAcc should start CONTESTING (drop from ~0.97), shoulder/thorax
# errors should fall, but EpLen must NOT crater (stability cliff toward
# disc-only). If EpLen craters -> back off to 2.0; if shoulder still stuck ->
# push higher or lower task weight.
agent_name: "AMP"

model:
  actor_net: "fc_2layers_1024units"
  actor_init_output_scale: 0.01
  actor_std_type: "FIXED"
  action_std: 0.05

  critic_net: "fc_2layers_1024units"

  disc_net: "fc_2layers_1024units"

optimizer:
    type: "SGD"
    learning_rate: 3e-5

discount: 0.99
steps_per_iter: 32
iters_per_output: 100
test_episodes: 32
normalizer_samples: 100000000

update_epochs: 5
batch_size: 4
td_lambda: 0.95
ppo_clip_ratio: 0.2
norm_adv_clip: 4.0
action_bound_weight: 10.0
action_entropy_weight: 0.0
action_reg_weight: 0.0
critic_loss_weight: 1.0

disc_buffer_size: 200000
disc_replay_samples: 1000
disc_batch_size: 2048
disc_loss_weight: 5
disc_logit_reg: 0.01
disc_grad_penalty: 5
disc_weight_decay: 0.0001
disc_reward_scale: 2

task_reward_weight: 1.0
disc_reward_weight: 3.0
