# Hybrid DeepMimic + AMP agent. Pairs with amp_smpl_handstand_hybrid_env.yaml,
# whose env task reward is the full DeepMimic tracking reward + aux
# (enable_task_tracking). Final reward = task_reward_weight * (tracking+aux)
# + disc_reward_weight * disc_style.
#
# Weights: equal mix (1.0 / 1.0) as the principled default - tracking anchors
# stability + kick-up, the discriminator pushes proximal style. The disc weight
# is THE knob to tune: too low and the shoulder stays where tracking leaves it
# (~40 deg off); too high risks AMP's adversarial pathologies (DiscAcc pinning,
# destabilizing the otherwise-clean tracker). Watch DiscAcc (must contest, not
# pin ~0.98), EpLen (stability), and the probe's shoulder error together.
agent_name: "AMP"

model:
  actor_net: "fc_2layers_1024units"
  actor_init_output_scale: 0.01
  actor_std_type: "FIXED"
  action_std: 0.05

  critic_net: "fc_2layers_1024units"

  disc_net: "fc_2layers_1024units"

optimizer:
    type: "SGD"
    learning_rate: 3e-5

discount: 0.99
steps_per_iter: 32
iters_per_output: 100
test_episodes: 32
normalizer_samples: 100000000

update_epochs: 5
batch_size: 4
td_lambda: 0.95
ppo_clip_ratio: 0.2
norm_adv_clip: 4.0
action_bound_weight: 10.0
action_entropy_weight: 0.0
action_reg_weight: 0.0
critic_loss_weight: 1.0

disc_buffer_size: 200000
disc_replay_samples: 1000
disc_batch_size: 2048
disc_loss_weight: 5
disc_logit_reg: 0.01
disc_grad_penalty: 5
disc_weight_decay: 0.0001
disc_reward_scale: 2

task_reward_weight: 1.0
disc_reward_weight: 1.0
