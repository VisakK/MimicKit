env_name: "view_motion"

env:
    char_file: "data/assets/smpl/smpl_boxhands.xml"
    camera_mode: "track"

    episode_length: 20.0 # seconds
    global_obs: False
    root_height_obs: True

    key_bodies: ["L_Toe", "R_Toe", "Head", "L_Hand", "R_Hand"]

    motion_file: "data/motions/smpl/220923_Crane_Crow_Pose_or_Bakasana_-a"

    # Per-clip z-correction (meters). Measured offline with
    # tools/measure_ground_offset.py: the raw Bakasana-a clip penetrates the
    # floor everywhere (feet ~2.4 cm at the standing entry, hands ~6.2 cm
    # through the t~11-23 s balance hold). +0.0624 m seats the hold's hands
    # exactly at z=0 (the standing entry then floats ~3.8 cm). Set to 0.0 to
    # watch the RAW penetrating clip for comparison.
    ground_offset: 0.0624


engine:
    engine_name: "isaac_lab"

    control_mode: "none"
    control_freq: 30
    sim_freq: 30
    env_spacing: 5

    ground_contact_height: 0.3
