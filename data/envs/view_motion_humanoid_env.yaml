env_name: "view_motion"

env:
    char_file: "data/assets/humanoid/humanoid.xml"
    camera_mode: "track"

    episode_length: 20.0 # seconds
    global_obs: False
    root_height_obs: True
    
    key_bodies: ["head", "right_hand", "left_hand", "right_foot", "left_foot"]

    motion_file: "data/motions/humanoid/yoga_pose"


engine:
    engine_name: "isaac_lab"
    
    control_mode: "none"
    control_freq: 30
    sim_freq: 30
    env_spacing: 5
    
    ground_contact_height: 0.3