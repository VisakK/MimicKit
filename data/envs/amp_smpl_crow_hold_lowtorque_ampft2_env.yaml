# The signed-off old-asset crow standard is 0.3%. The original crow ft ladder
# cleared exactly this tap at the STRONGER tier -- this env is that rung.
# Deltas from the ampft env: toe_lift 0->0.45, toe_force_pen 0.25->0.45,
# cop_support 0.25/10->0.5/15 (lean kept), knee_support 0.25->0.5.
